name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      benchmark: ${{ steps.scope.outputs.benchmark }}
      core: ${{ steps.scope.outputs.core }}
      docsOnly: ${{ steps.scope.outputs.docsOnly }}
      node: ${{ steps.scope.outputs.node }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect changed files
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$base" "$head" > changed-files.txt
          fi

          cat changed-files.txt

      - name: Validate whitespace in changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$base" "$head"
          fi

      - name: Classify CI scope
        id: scope
        shell: bash
        run: |
          docs_only=true
          benchmark=false
          core=false
          node=false

          if [ ! -s changed-files.txt ]; then
            docs_only=false
          fi

          while IFS= read -r path; do
            path="${path#./}"
            case "$path" in
              *.md|*.mdx) ;;
              *) docs_only=false ;;
            esac

            case "$path" in
              .github/workflows/ci.yml|src/*|tests/*|scripts/*|package.json|bun.lock|tsconfig.json|vite.config.ts)
                core=true
                ;;
            esac

            case "$path" in
              .github/workflows/ci.yml|plugins/node/*|src/*|tests/types/*|package.json|bun.lock|tsconfig.json|vite.config.ts)
                node=true
                ;;
            esac

            case "$path" in
              .github/workflows/ci.yml|src/writers/pptx/*|src/projection/pptx/*|src/pipeline|src/pipeline-*|src/pipeline.*|src/adapter.ts|tests/pptx/*|scripts/benchmark-pptx-writer.tsx|.github/scripts/benchmark-pptx-with-diagnostics.sh|package.json|bun.lock)
                benchmark=true
                ;;
            esac
          done < changed-files.txt

          if [ "$docs_only" = "true" ]; then
            benchmark=false
            core=false
            node=false
          fi

          {
            echo "benchmark=$benchmark"
            echo "core=$core"
            echo "docsOnly=$docs_only"
            echo "node=$node"
          } | tee -a "$GITHUB_OUTPUT"

  core:
    name: Core check and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  benchmark:
    name: Direct PPTX writer benchmark
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Benchmark direct PPTX writer
        run: bash .github/scripts/benchmark-pptx-with-diagnostics.sh

  node:
    name: "@deckjsx/node check and test"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.node == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Build deckjsx package
        run: bun run build

      - name: Install @deckjsx/node dependencies
        working-directory: plugins/node
        run: bun install

      - name: Check @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp check

      - name: Build @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp pack

      - name: Test @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp test
