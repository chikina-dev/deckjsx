name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Core check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Benchmark direct PPTX writer
        run: bash .github/scripts/benchmark-pptx-with-diagnostics.sh

  node:
    name: "@deckjsx/node check and test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Build deckjsx package
        run: bun run build

      - name: Install @deckjsx/node dependencies
        working-directory: plugins/node
        run: bun install

      - name: Check @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp check

      - name: Build @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp pack

      - name: Test @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp test
