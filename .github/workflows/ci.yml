name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      benchmark: ${{ steps.scope.outputs.benchmark }}
      core: ${{ steps.scope.outputs.core }}
      docsOnly: ${{ steps.scope.outputs.docsOnly }}
      node: ${{ steps.scope.outputs.node }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Collect changed files
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$base" "$head" > changed-files.txt
          fi

          cat changed-files.txt

      - name: Validate whitespace in changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$base" "$head"
          fi

      - name: Classify CI scope
        id: scope
        run: node scripts/ci-scope.mjs --github-output "$GITHUB_OUTPUT" < changed-files.txt

  core:
    name: Core check and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  benchmark:
    name: Direct PPTX writer benchmark
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Benchmark direct PPTX writer
        run: bash .github/scripts/benchmark-pptx-with-diagnostics.sh

  node:
    name: "@deckjsx/node check and test"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.node == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Build deckjsx package
        run: bun run build

      - name: Install @deckjsx/node dependencies
        working-directory: plugins/node
        run: bun install

      - name: Check @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp check

      - name: Build @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp pack

      - name: Test @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp test
