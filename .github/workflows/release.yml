name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - deckjsx
          - "@deckjsx/node"
          - "@deckjsx/vite"
      version:
        description: Package version to release, for example v0.9.0 or v0.1.0
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build and pack without publishing to npm
        required: false
        type: boolean
        default: false
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release package
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            prerelease="${{ github.event.release.prerelease }}"
            dry_run="false"
            selected_package=""
          else
            input_version="${{ inputs.version }}"
            prerelease="${{ inputs.prerelease }}"
            dry_run="${{ inputs.dry_run }}"
            selected_package="${{ inputs.package }}"
          fi

          resolve_package() {
            case "$1" in
              deckjsx)
                package_name="deckjsx"
                package_dir="."
                package_json="package.json"
                tag="v$version"
                ;;
              @deckjsx/node)
                package_name="@deckjsx/node"
                package_dir="plugins/node"
                package_json="plugins/node/package.json"
                tag="deckjsx-node-v$version"
                ;;
              @deckjsx/vite)
                package_name="@deckjsx/vite"
                package_dir="plugins/vite"
                package_json="plugins/vite/package.json"
                tag="deckjsx-vite-v$version"
                ;;
              *)
                echo "Unknown package: $1" >&2
                exit 1
                ;;
            esac
          }

          if [ -n "$selected_package" ]; then
            case "$input_version" in
              v*)
                version="${input_version#v}"
                ;;
              *)
                echo "Release version must look like v0.9.0 or v0.1.0." >&2
                exit 1
                ;;
            esac
            resolve_package "$selected_package"
          else
            case "$tag" in
              v*)
                version="${tag#v}"
                resolve_package "deckjsx"
                ;;
              deckjsx-node-v*)
                version="${tag#deckjsx-node-v}"
                resolve_package "@deckjsx/node"
                ;;
              deckjsx-vite-v*)
                version="${tag#deckjsx-vite-v}"
                resolve_package "@deckjsx/vite"
                ;;
              *)
                echo "Release tag must look like v0.9.0, deckjsx-node-v0.1.0, or deckjsx-vite-v0.1.0." >&2
                exit 1
                ;;
            esac
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version contains invalid package version: $version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"
          echo "package_json=$package_json" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package version
        shell: bash
        run: |
          package_version="$(node -p "require('./${{ steps.release.outputs.package_json }}').version")"
          if [ "$package_version" != "${{ steps.release.outputs.version }}" ]; then
            echo "${{ steps.release.outputs.package_json }} version $package_version does not match ${{ steps.release.outputs.tag }}." >&2
            exit 1
          fi

      - name: Validate release source
        if: steps.release.outputs.dry_run != 'true'
        shell: bash
        run: |
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$default_branch"

          if ! git merge-base --is-ancestor HEAD "origin/$default_branch"; then
            echo "Release commits must be contained in origin/$default_branch before publishing." >&2
            exit 1
          fi

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Check @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp check

      - name: Pack @deckjsx/node
        working-directory: plugins/node
        run: ../../node_modules/.bin/vp pack

      - name: Check @deckjsx/vite
        working-directory: plugins/vite
        run: ../../node_modules/.bin/vp check

      - name: Pack @deckjsx/vite
        working-directory: plugins/vite
        run: ../../node_modules/.bin/vp pack

      - name: Install sample dependencies
        run: npm ci --prefix sample

      - name: Run sample smoke
        run: npm run --prefix sample smoke

      - name: Test
        run: bun run test

      - name: Benchmark direct PPTX writer
        run: bash .github/scripts/benchmark-pptx-with-diagnostics.sh

      - name: Verify render fixtures
        run: bun run verify:render -- --skip-raster

      - name: Install PPTX oracle dependencies
        run: npm install --no-audit --no-fund --prefix .github/compat/pptxgenjs

      - name: Compare direct PPTX writer with oracle
        run: npm run --prefix .github/compat/pptxgenjs compare

      - name: Pack selected package
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: npm pack

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            args=(gh release create "$TAG" --title "$PACKAGE_NAME ${{ steps.release.outputs.version }}" --generate-notes --verify-tag)
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            "${args[@]}"
          fi

      - name: Publish dry run
        if: steps.release.outputs.dry_run == 'true'
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: steps.release.outputs.dry_run != 'true'
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: npm publish --access public
