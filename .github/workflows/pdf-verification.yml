name: PDF verification

on:
  pull_request:
    paths:
      - ".github/workflows/pdf-verification.yml"
      - "src/font/**"
      - "src/layout/**"
      - "src/projection/pdf/**"
      - "src/writers/pdf/**"
      - "tests/font/**"
      - "tests/pdf/**"
      - "tests/render-confidence/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-pdf:
    name: Direct PDF model, writer, fonts, and raster parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice poppler-utils qpdf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build deckjsx package
        run: bun run build

      - name: Test PDF model, writer, public surface, and font assets
        run: >
          ./node_modules/.bin/vp test
          tests/pdf/pdf-model.test.ts
          tests/pdf/pdf-writer.test.ts
          tests/pdf/public-surface.test.tsx
          tests/pdf/font-assets.test.tsx
          tests/pdf/font-asset-artifacts.test.tsx
          tests/pdf/image-input-validation.test.ts
          tests/pdf/truetype.test.ts
          tests/font/family.test.ts

      - name: Compare direct PDF with the PPTX-derived oracle
        env:
          DECKJSX_PDF_LIBREOFFICE_ORACLE: "1"
          DECKJSX_PDF_RASTER_ORACLE_ARTIFACT_DIR: ${{ runner.temp }}/deckjsx-pdf-raster-artifacts
        run: ./node_modules/.bin/vp test tests/pdf/verification.test.tsx

      - name: Upload PDF raster comparison artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pdf-raster-parity
          path: ${{ runner.temp }}/deckjsx-pdf-raster-artifacts
