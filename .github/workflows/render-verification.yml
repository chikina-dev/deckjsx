name: Render verification

on:
  pull_request:
    paths:
      - ".github/workflows/render-verification.yml"
      - "Dockerfile.render"
      - "examples/**"
      - "scripts/verify-render.ts"
      - "src/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render sample deck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build render image
        run: docker build -f Dockerfile.render -t deckjsx-render .

      - name: Render sample deck
        run: docker run --name deckjsx-render-run deckjsx-render

      - name: Copy render artifacts
        if: always()
        run: docker cp deckjsx-render-run:/workspace/examples/rendered ./examples/rendered

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: render-verification
          path: examples/rendered
