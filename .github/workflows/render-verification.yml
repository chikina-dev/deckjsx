name: Render verification

on:
  pull_request:
    paths:
      - ".github/workflows/render-verification.yml"
      - ".github/render/**"
      - "tests/render-confidence/**"
      - "src/**"
      - "src/adapter/**"
      - "src/graph/**"
      - "src/layout/**"
      - "src/projection/pptx/**"
      - "src/style/**"
      - "src/writers/pptx/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render confidence (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: feature-text-layout
            artifact: render-confidence-feature-text-layout
          - group: feature-media-table
            artifact: render-confidence-feature-media-table
          - group: scenario-business
            artifact: render-confidence-scenario-business
          - group: scenario-technical
            artifact: render-confidence-scenario-technical
          - group: scenario-heavy
            artifact: render-confidence-scenario-heavy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build render image
        id: build
        continue-on-error: true
        run: docker build -f .github/render/Dockerfile -t deckjsx-render .

      - name: Render confidence fixture group
        id: render
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: >
          docker run
          --name deckjsx-render-run
          -e DECKJSX_RENDER_FIXTURE_GROUP=${{ matrix.group }}
          deckjsx-render

      - name: Copy render artifacts
        if: always()
        run: |
          mkdir -p ./.github/render/artifacts
          if docker container inspect deckjsx-render-run >/dev/null 2>&1; then
            if ! docker cp deckjsx-render-run:/workspace/.github/render/artifacts/. ./.github/render/artifacts 2>./.github/render/artifacts/docker-cp-error.log; then
              {
                echo "Render artifact directory was not created in the container."
                echo
                echo "docker cp error:"
                cat ./.github/render/artifacts/docker-cp-error.log
                echo
                echo "Render container logs:"
                docker logs deckjsx-render-run || true
              } > ./.github/render/artifacts/render-verification.log
            fi
          else
            echo "Render container was not created." > ./.github/render/artifacts/render-verification.log
          fi

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: .github/render/artifacts

      - name: Fail on render verification error
        if: steps.build.outcome == 'failure' || steps.render.outcome == 'failure'
        run: exit 1
